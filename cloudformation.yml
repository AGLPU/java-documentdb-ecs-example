AWSTemplateFormatVersion: 2010-09-09
Description: ECS Fargate Service with ALB for java-mongo-example

Parameters:
  VpcId:
    Type: String
    Default: vpc-0079a6744ccd6bc59

  PublicSubnet1:
    Type: String
    Default: subnet-0126970dac0987c8a

  PublicSubnet2:
    Type: String
    Default: subnet-0de37b099cd5456f9

  PrivateSubnet1:
    Type: String
    Default: subnet-07fd64ddc1a10bd66

  PrivateSubnet2:
    Type: String
    Default: subnet-0e24ab6efb89d70d2

  AppName:
    Type: String
    Default: java-mongo-example

  ContainerPort:
    Type: Number
    Default: 8080

  EcrRepoName:
    Type: String
    Default: ag_sse/java-mongo-example
    
  DocDBEndpoint: 
    Type: String
    Default: docdb-2025-11-17-15-45-22.cluster-crweyyisomb8.ap-south-1.docdb.amazonaws.com  

  dbName:
    Type: String
    Default: BookStore

  dbPassword:
    Type: String
    Default: "HFrJrRXftQ.IWz5|:HF(5v)|pm_:"


Resources:

  #########################################################
  #  ECR Repository
  #########################################################
 # EcrRepository:
  #  Type: AWS::ECR::Repository
   # Properties:
    #  RepositoryName: !Ref EcrRepoName

  #########################################################
  # NAT GATEWAY + ROUTE TABLES
  #########################################################

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  # Private Route Table 1
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId

  # Routes: Private Subnets → NAT Gateway
  PrivateSubnetRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway


  # Associate Private Subnets to Private Route Tables
  PrivateSubnet1Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2Association:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable1

  #########################################################
  # IAM Roles
  #########################################################
  ECSExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  #########################################################
  # Security Groups
  #########################################################
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB to reach ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  #########################################################
  #  ALB + Target Group
  #########################################################
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  #########################################################
  # ECS Cluster
  #########################################################
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref AppName
  
  ECSLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 14  

  #########################################################
  # Task Definition
  #########################################################
  ECSTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AppName
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref ECSExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepoName}:latest"
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
          - Name: MONGO_URI
            Value: !Sub "mongodb://${DocDBEndpoint}:27017/BookStore?tls=true&retryWrites=false&authSource=admin"
          - Name: MONGO_DBNAME
            Value: !Ref dbName
          - Name: MONGO_PASSWORD
            Value: !Ref dbPassword

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Sub "/ecs/${AppName}"
              awslogs-stream-prefix: app

  #########################################################
  # ECS Service
  #########################################################
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: java-mongo-example
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref ECSTaskDefinition 
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref ALBTargetGroup

Outputs:
  LoadBalancerDNS:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Description: Public ALB URL
